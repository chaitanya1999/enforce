<div class="root">
    <div class="topBarCard">
        <div class="topBar" style="padding-top: 0px; padding-bottom: 0px;">
        
            <div class="checkbox form-check">
                <label for="flattenCheckbox" class="form-check-label">
                    <input id="flattenCheckbox" class="form-check-input" type="checkbox" [(ngModel)]="flattenSubqueries" (ngModelChange)="onFlattenCheckbox($event)"/><span style="margin-left: 3px;">Flat</span>
                </label>
            </div>
            <div class="checkbox form-check" >
                <label for="toolingCheckbox" class="form-check-label">
                    <input id="toolingCheckbox" class="form-check-input" type="checkbox" [(ngModel)]="toolingApi"/><span style="margin-left: 3px;">Tooling</span>
                </label>
            </div>
            <div class="checkbox form-check" >
                <label for="deletedCheckbox" class="form-check-label">
                    <input id="deletedCheckbox" class="form-check-input" type="checkbox" [(ngModel)]="fetchDeleted"/><span style="margin-left: 3px;">Deleted</span>
                </label>
            </div>
            <select class="form-select topBarItem" style="margin-left:20px; font-size: 0.8em;" [(ngModel)]="selectedQueryHistory" (ngModelChange)="onQueryHistorySelect($event)">
                <option ngValue="Query History">Query History</option>
                @for(query of queryHistory; track query) {
                    <option [ngValue]="query">{{query.label}}</option>
                }
            </select>
    
        </div>
        <div class="topBar" style="padding:0px;">    
            <!-- Authenticate button -->
            <!-- <button class="btn btn-primary topBarItem" (click)="authenticate()">Authenticate</button> -->
    
            
            <!-- Query Input -->
            <!--
            <textarea #queryInput class="queryInput" [(ngModel)]="soqlQuery" (ngModelChange)="onQueryTyped()" (keypress)="onKeyPress($event)" spellcheck="false"></textarea>
            -->
            <app-code-editor #queryInput
                [code]="'SELECT Id, Name FROM Account LIMIT 10'"
                [defaultLanguage]="'sql'"
                (codeChange)="onQueryTyped($event)"
                (onCursorPositionChange)="onCodeEditorCursor($event)"
                (ctrlEnter)="executeQuery()"
                style="height:120px;width:100%;"
                [fontSize]="16"
                [passContentOnContentChange]="true"
                (monacoInitialized)="onMonacoInitialized($event)"
            ></app-code-editor>
            
            <!-- Execute button -->
            <button class="btn btn-primary topBarItem" style="height: 100%;margin-left: 0px; margin-right:0px;" (click)="executeQuery()" >
                <i class="bi bi-search"></i>
            </button>
        </div>
        <div class="topBar" style="padding-top: 0px; padding-bottom: 0px; width: 100%;">

            <!-- Salesforce Org dropdown -->
            <select class="form-select topBarItem" aria-label="Salesforce Org"
                [ngModel]="selectedOrg"
                (ngModelChange)="onOrgSelect($event)"
                style="width: 180px; min-width: 120px; max-width: 220px; display: inline-block; font-size: 1em;padding: 4px 5px 4px 16px;">
                <option>--Org--</option>
                @for (orgCred of orgCredsList; track orgCred) {
                    <option [value]="orgCred.orgName">{{orgCred.orgName}}</option>
                }
            </select>

            <div class="filter" style="width: 280px; min-width: 100px; max-width: 400px; display: inline-block; margin-left: 10px;">
                <input placeholder="Filter...." [(ngModel)]="filterInput" (ngModelChange)="onInputFilter()" spellcheck="false" class="form-control filterInput" style="width: 100%;font-size: 1em;padding: 4px 5px 4px 30px;"/>
            </div>

            {{parseQuerySituation}}

            <span class="records-count" style="justify-self: flex-end;">{{ (tableData.totalSize || tableData.totalSize == 0) ? tableData.totalSize + ' records ' : ''}}</span>
    
        </div>
    </div>
    <div class="contents">
        @if(queryOutputSuccess == true) {
            <app-query-output-table [data]="tableData" [flattenSubqueries]="flattenSubqueries" [instanceUrl]="instanceUrl"></app-query-output-table>
        }
        @else {
            <!-- <textarea style="height: fit-content; width: 100%;" readonly [value]="queryOutput"></textarea> -->
            <div style="height: fit-content; width: 100%; white-space: pre; padding: 10px;  overflow-wrap: break-word;  word-wrap: normal; text-wrap: wrap;">{{queryOutput}}</div>
        }
    </div>
</div>

@if(showSpinner == true) {
    <div class="spinnerDiv">
        <div class="spinnerContainer">
            <mat-spinner></mat-spinner>
        </div>
    </div>
}
